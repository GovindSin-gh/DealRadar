name: Weekly retraining
on:
  schedule:
    - cron: "0 0 * * 0"    # Sunday 00:00 UTC = 05:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if fewer than 500 new reviews"
        type: boolean
        default: false
permissions:
  contents: write           # lets the job commit the new champion model
concurrency: retrain
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: mlops/requirements.txt }
      - run: pip install -r mlops/requirements.txt mlflow "dvc>=3"

      - name: Pull the current dataset (DVC)
        if: hashFiles('.dvc/config') != ''
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull -r origin || echo "no dataset in remote yet"

      - name: Retrain, test on the gold set, run the quality gate
        id: retrain
        working-directory: mlops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER }}/dealradar.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python retrain.py

      - name: Snapshot the dataset (DVC)
        if: steps.retrain.outputs.trained == 'true' && hashFiles('.dvc/config') != ''
        run: |
          dvc add mlops/data/train_current.csv
          dvc push -r origin

      - name: Commit new dataset pointer and champion model
        if: steps.retrain.outputs.trained == 'true'
        run: |
          git config user.name "dealradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add mlops/data/train_current.csv.dvc backend/models/champion 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "Weekly retrain: ${{ steps.retrain.outputs.version }} (promoted=${{ steps.retrain.outputs.promoted }})" && git push)

      - name: Trigger Render deploy (only if a new model was promoted)
        if: steps.retrain.outputs.promoted == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "No deploy hook set; Render deploys from the new commit"; fi
